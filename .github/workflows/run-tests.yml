# Run the test suite on Linux, macOS and Windows on every push to master and on pull requests,
# slow tier included. The very_slow tests, whose data is not committed, run locally.
# Dependencies are installed with uv (no conda).

name: tests

on:
  push:
    branches: [master]
    paths-ignore: ['docs/**', '**.md', '**.rst']
  pull_request:
    paths-ignore: ['docs/**', '**.md', '**.rst']

permissions:
  contents: read

jobs:
  test:
    name: run tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install sfsutils + test deps
        run: uv pip install --system -e ".[vcf,zarr,arg]" bio2zarr vcztools msprime phasegen pytest pytest-xdist pytest-sugar
      - name: Run tests
        run: pytest -n auto -m "not very_slow" testing/
