# Run the test suite on Linux, macOS and Windows with Python 3.11, and on Linux with 3.12 to 3.14,
# on every push to master and dev and on pull requests, slow tier included. The very_slow tests,
# whose data is not committed, run locally. Dependencies are installed with uv (no conda).

name: tests

on:
  push:
    branches: [master, dev]
    paths-ignore: ['docs/**', '**.md', '**.rst']
  pull_request:
    paths-ignore: ['docs/**', '**.md', '**.rst']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: run tests on ${{ matrix.os }} with Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11"]
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: ubuntu-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install sfsutils + test deps
        run: uv pip install --system -e ".[vcf,zarr,arg]" bio2zarr vcztools msprime phasegen "pysam; sys_platform != 'win32'" pytest pytest-xdist pytest-sugar
      - name: Run tests
        run: pytest -n auto -m "not very_slow" testing/
